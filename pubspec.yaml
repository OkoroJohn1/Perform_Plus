name: perform_plus
description: Academic performance tracking and AI advisory for Nigerian students.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Local-first storage. The CGPA engine is pure computation and must run
  # with zero network — a student on 3G in a lecture hall still opens to a
  # working dashboard. Drift is the source of truth; Postgres is the mirror.
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0

  # Utilities
  collection: ^1.18.0
  uuid: ^4.4.0
  intl: ^0.19.0

  # Charts
  fl_chart: ^0.68.0

  # Result slip import
  image_picker: ^1.1.2

  # Backend. Supabase gives auth + Postgres + storage + RLS in one.
  # Enforce Row Level Security from day one; academic records are sensitive.
  supabase_flutter: ^2.5.6

  # PDF reports
  pdf: ^3.11.0
  printing: ^5.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
    background_color: "#0B0A18"
    theme_color: "#0B0A18"
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#0B0A18"
  adaptive_icon_foreground: "assets/images/app_icon.png"
