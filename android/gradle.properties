org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Release builds pull the Flutter engine's native-library JARs
# (armeabi_v7a_release/arm64_v8a_release/x86_64_release) from
# storage.googleapis.com fresh -- debug builds don't need them, which is why
# this only ever bit `flutter build apk --release`. Default Gradle timeouts
# (30s connect, 30s socket) are too tight for a slow/unstable connection to
# reliably pull a multi-MB jar; raised here rather than just retrying and
# hoping, since the failure was a "Read timed out"/"Connection timed out",
# not a genuine block (curl to the same host succeeded).
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=1000
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
